apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kubecraft.fullname" . }}
  labels:
    {{- include "kubecraft.labels" . | nindent 4 }}
automountServiceAccountToken: true
---
# Namespaced only: the manager never gets cluster-wide access.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "kubecraft.fullname" . }}
  labels:
    {{- include "kubecraft.labels" . | nindent 4 }}
rules:
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services", "persistentvolumeclaims", "secrets", "configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    # create is for the temporary file pod of a stopped server.
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "kubecraft.fullname" . }}
  labels:
    {{- include "kubecraft.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "kubecraft.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "kubecraft.fullname" . }}
    namespace: {{ .Release.Namespace }}

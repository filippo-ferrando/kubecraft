{{- if not .Values.secrets.existingSecret }}
{{- if not .Values.secrets.sessionSecret }}
{{- fail "set secrets.existingSecret or secrets.sessionSecret" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kubecraft.secretName" . }}
  labels:
    {{- include "kubecraft.labels" . | nindent 4 }}
type: Opaque
stringData:
  SESSION_SECRET: {{ .Values.secrets.sessionSecret | quote }}
  {{- with .Values.secrets.bootstrapAdminUser }}
  BOOTSTRAP_ADMIN_USER: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.bootstrapAdminPassword }}
  BOOTSTRAP_ADMIN_PASSWORD: {{ . | quote }}
  {{- end }}
{{- end }}

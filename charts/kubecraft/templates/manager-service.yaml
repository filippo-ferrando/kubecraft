apiVersion: v1
kind: Service
metadata:
  name: {{ include "kubecraft.fullname" . }}
  labels:
    {{- include "kubecraft.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "kubecraft.managerSelector" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http

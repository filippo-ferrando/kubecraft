{{- if .Values.networkPolicy.enabled }}
# Manager: only the ingress controller reaches the UI/API.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kubecraft.fullname" . }}-manager
  labels:
    {{- include "kubecraft.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "kubecraft.managerSelector" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- toYaml .Values.networkPolicy.managerFrom | nindent 8 }}
      ports:
        - port: 8080
    {{- if .Values.metrics.enabled }}
    - from:
        {{- toYaml .Values.networkPolicy.metricsFrom | nindent 8 }}
      ports:
        - port: {{ .Values.metrics.port }}
    {{- end }}
---
# mc-router: open on the Minecraft port, exposure is decided by its Service.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kubecraft.fullname" . }}-mc-router
  labels:
    {{- include "kubecraft.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "kubecraft.routerSelector" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: 25565
    {{- if .Values.mcRouter.metrics }}
    - from:
        {{- toYaml .Values.networkPolicy.metricsFrom | nindent 8 }}
      ports:
        - port: 8080
    {{- end }}
---
# Game servers: game port from mc-router and the manager, RCON and files from the manager only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kubecraft.fullname" . }}-servers
  labels:
    {{- include "kubecraft.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/managed-by: mc-manager
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "kubecraft.routerSelector" . | nindent 14 }}
        - podSelector:
            matchLabels:
              {{- include "kubecraft.managerSelector" . | nindent 14 }}
      ports:
        - port: 25565
    - from:
        - podSelector:
            matchLabels:
              {{- include "kubecraft.managerSelector" . | nindent 14 }}
      ports:
        - port: 25575
        - port: 8081
{{- if .Values.networkPolicy.serverEgress.enabled }}
---
# Game servers run user chosen code: DNS and the internet only, no cluster or LAN.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kubecraft.fullname" . }}-servers-egress
  labels:
    {{- include "kubecraft.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/managed-by: mc-manager
  policyTypes: [Egress]
  egress:
    - to:
        {{- toYaml .Values.networkPolicy.serverEgress.dnsTo | nindent 8 }}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            {{- with .Values.networkPolicy.serverEgress.blockedCIDRs }}
            except:
              {{- toYaml . | nindent 14 }}
            {{- end }}
{{- end }}
{{- if .Values.playit.enabled }}
---
# playit gateway: no inbound traffic at all; the agent dials out and reaches the
# gate over localhost, the gate dials mc-router.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kubecraft.fullname" . }}-playit-gateway
  labels:
    {{- include "kubecraft.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "kubecraft.gatewaySelector" . | nindent 6 }}
  policyTypes: [Ingress]
{{- end }}
{{- end }}

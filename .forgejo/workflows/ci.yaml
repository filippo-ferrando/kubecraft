# Tests pushes to main and pull requests. Tags are tested by release.yaml.
# Changes that only touch docs or repo metadata skip CI.
name: CI

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    # Integration tests create one database per test on this instance.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
    env:
      TEST_DATABASE_URL: postgres://test:test@postgres:5432/test?sslmode=disable
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest

      - name: Wait for postgres
        run: |
          for i in $(seq 30); do
            (echo > /dev/tcp/postgres/5432) 2>/dev/null && exit 0
            sleep 1
          done
          echo "postgres did not start" >&2
          exit 1

      - name: Test
        run: go test -race -count=1 ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - run: npm run build

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v4

      - name: Lint chart
        run: make chart-lint-local

  # Builds the image without pushing, to catch Dockerfile breakage before a release.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Docker CLI
        run: curl -fsSL https://get.docker.com | sh

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          build-args: |
            VERSION=ci-${{ github.sha }}
